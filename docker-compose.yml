services:
  mlflow:
    build:
      context: .
      target: runtime
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////app/artifacts/mlflow.db
      - --default-artifact-root=/app/artifacts/mlruns
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  trainer:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: ["python", "-m", "recommender.training.train"]
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports

volumes:
  mlflow_artifacts:

