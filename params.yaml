data:
  positive_rating: 4
  min_user_interactions: 5
  test_items_per_user: 1
  validation_items_per_user: 1

model:
  embedding_dim: 32
  hidden_dims: [64, 32]
  dropout: 0.2
  negatives_per_positive: 2
  learning_rate: 0.001
  batch_size: 1024
  epochs: 12
  patience: 3
  min_delta: 0.0001

evaluation:
  top_k: 10

experiments:
  neural_runs:
    - name: ncf-base
      embedding_dim: 16
      hidden_dims: [32, 16]
      dropout: 0.1
    - name: ncf-regularized
      embedding_dim: 32
      hidden_dims: [64, 32]
      dropout: 0.2

